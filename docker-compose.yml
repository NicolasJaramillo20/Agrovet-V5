services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/agrovet
      CLIENT_ORIGIN: http://localhost:${APP_PORT:-5000}
      FRONTEND_URL: http://localhost:${APP_PORT:-5000}
      DATABASE_URL: ""
      POSTGRES_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: agrovet
      POSTGRES_USER: agrovet_app
      POSTGRES_PASSWORD: docker-postgres-password
      MYSQL_URL: ""
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: agrovet_mysql
      MYSQL_USER: agrovet_app
      MYSQL_PASSWORD: docker-mysql-password
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agrovet
      POSTGRES_USER: agrovet_app
      POSTGRES_PASSWORD: docker-postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovet_app -d agrovet"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: agrovet_mysql
      MYSQL_USER: agrovet_app
      MYSQL_PASSWORD: docker-mysql-password
      MYSQL_ROOT_PASSWORD: docker-mysql-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uagrovet_app", "-pdocker-mysql-password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mongo-data:
  postgres-data:
  mysql-data:
